version: 2
project_name: bento
builds:
  - main: ./main.go
    binary: bento
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w
      - -X github.com/catatsuy/bento/internal/cli.Version=v{{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'
    formats: [tar.gz]
    builds_info:
      mtime: '{{ .CommitTimestamp }}'
checksum:
  name_template: checksums.txt
