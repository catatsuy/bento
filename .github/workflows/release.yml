name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/release-build.yml

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          for artifact in release/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$COMMIT" \
              --signer-digest "$COMMIT" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml"
          done
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
